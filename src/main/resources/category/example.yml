version: 5
gui-type: CHEST_27
gui-name: "<aqua><bold>Example Shop</bold></aqua>"
pages:
-   buttons:
    -   button-type: FILLER
        display-item:
            item-type: GRAY_STAINED_GLASS_PANE
            name: " "
            lore: []
    -   button-type: RETURN
        slot: 22
        display-item:
            item-type: BARRIER
            name: "<yellow>Exit the shop.</yellow>"
            lore: []
    -   button-type: NEXT_PAGE
        slot: 24
        display-item:
            item-type: ARROW
            name: "<yellow>Next Page.</yellow>"
            lore: []
    -   button-type: TRANSACTION
        slot: 0
        display-item:
            item-type: crafting_table
            name: "<white>Crafting Table</white>"
            lore:
                - "Buy for: <buy_price>"
                - "Sell for: <sell_price>"
        transaction-data:
            transaction-id: "example:0:5"
            transaction-type: ITEM
            transaction-style: items
            transaction-name: "Crafting Table"
            prices:
                buy-modifier:
                    cooldown-seconds: -1
                    update-interval-seconds: -1
                    count-before-modifier: -1
                    money-modifier: -1.0
                    points-modifier: -1
                sell-modifier:
                    cooldown-seconds: -1
                    update-interval-seconds: -1
                    count-before-modifier: -1
                    money-modifier: -1.0
                    points-modifier: -1
                buy-money: 100.0
                buy-points: -1
                sell-money: 10.0
                sell-points: -1
            display-item:
                item-type: crafting_table
            transaction-list:
                -   version: 1
                    id: skyshop:item
                    transaction-item:
                        item-type: crafting_table
                    cache-sell-price: true
-   buttons:
    -   button-type: FILLER
        display-item:
            item-type: GRAY_STAINED_GLASS_PANE
            name: " "
            lore: []
    -   button-type: PREVIOUS_PAGE
        slot: 20
        display-item:
            item-type: ARROW
            name: "<yellow>Previous Page.</yellow>"
            lore: []
    -   button-type: RETURN
        slot: 22
        display-item:
            item-type: BARRIER
            name: "<yellow>Exit the shop.</yellow>"
            lore: []
    -   button-type: TRANSACTION
        slot: 0
        display-item:
            item-type: DIAMOND
            name: "<white>1 Diamond</white>"
            lore:
                - "Buy for: <buy_price>"
        transaction-data:
            transaction-id: "example:1:5"
            transaction-style: single_command
            transaction-name: "1 Diamond"
            prices:
                buy-modifier:
                    cooldown-seconds: -1
                    update-interval-seconds: -1
                    count-before-modifier: -1
                    money-modifier: -1.0
                    points-modifier: -1
                sell-modifier:
                    cooldown-seconds: -1
                    update-interval-seconds: -1
                    count-before-modifier: -1
                    money-modifier: -1.0
                    points-modifier: -1
                buy-money: 500.0
                buy-points: -1
                sell-money: -1.0
                sell-points: -1
            display-item:
                item-type: diamond
            transaction-list:
                -   version: 1
                    id: skyshop:commands
                    buy-commands:
                        - "give %player_name% diamond 1"
                    sell-commands: []